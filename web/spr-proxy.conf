# A question is at most 2,000 characters, so a body larger than this is not one. The read timeout leaves room for a
# real model call; the scripted model answers in milliseconds.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
client_max_body_size 16k;
