# Sent with every response, proxied ones included. The page needs no inline script or style, no other origin and no
# frame, so none is allowed.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
