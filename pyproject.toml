[project]
name = "secure-policy-rag"
version = "0.2.0"
description = "A policy assistant for bank staff where access control, PII redaction and citation checks hold even when the model or the app code misbehaves"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tunahan Ali Ozturk" }]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
spr = "secure_policy_rag.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_policy_rag"]

[tool.ruff]
line-length = 120
extend-exclude = [".claude"]
target-version = "py314"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "ARG", "PL", "RUF", "S", "DTZ", "T20", "ASYNC"]
ignore = [
    "N818",     # exceptions are named for what happened, not suffixed with Error
    "PLR0913",  # retrieval and evaluation take their tuning knobs explicitly; the knobs are keyword-only instead
]

[tool.ruff.lint.isort]
known-first-party = ["secure_policy_rag", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/secure_policy_rag/pii.py" = ["PLR2004"]  # check-digit arithmetic reads best with the numbers from its spec
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S311", "ARG"]
"tools/**" = ["T20", "PLR2004"]
"benchmarks/**" = ["T20", "PLR2004"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "testcontainers.*", "pgvector.*", "fastembed.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_package = "secure_policy_rag"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Guards are pure: redaction, prompt building, verification and ranking maths touch no database, web or model"
type = "forbidden"
source_modules = [
    "secure_policy_rag.pii",
    "secure_policy_rag.prompt",
    "secure_policy_rag.verify",
    "secure_policy_rag.fusion",
    "secure_policy_rag.metrics",
    "secure_policy_rag.corpus",
    "secure_policy_rag.identity",
]
forbidden_modules = ["asyncpg", "fastapi", "anthropic", "fastembed", "secure_policy_rag.store", "secure_policy_rag.api"]

[[tool.importlinter.contracts]]
name = "The API and everything under it never reach the demo login, the only code that hands out tokens"
type = "forbidden"
source_modules = ["secure_policy_rag.api", "secure_policy_rag.pipeline", "secure_policy_rag.store"]
forbidden_modules = ["secure_policy_rag.demo_login"]

[[tool.importlinter.contracts]]
name = "The demo login knows who the six people are and nothing about questions, the model or the database"
type = "forbidden"
source_modules = ["secure_policy_rag.demo_login"]
forbidden_modules = [
    "asyncpg",
    "anthropic",
    "fastembed",
    "secure_policy_rag.api",
    "secure_policy_rag.pipeline",
    "secure_policy_rag.store",
]
