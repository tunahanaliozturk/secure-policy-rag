# The console's one origin: the built page, the policy API under /api/ and the demo login under /login/. Same origin
# means no CORS anywhere, and a content security policy that lets the page talk to nothing else.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # nginx compresses at level 1 unless told otherwise, which sent the largest script as 43.5 kB where level 6 sends
  # it smaller for a few milliseconds of CPU per uncached request (docs/operations.md has the measured sizes).
  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;
  gzip_vary on;

  # nginx drops inherited add_header lines in any location that adds one of its own, so the security headers are a
  # file that every location includes.
  include /etc/nginx/spr-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/spr-headers.conf;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api:8000/;
    include /etc/nginx/spr-proxy.conf;
    include /etc/nginx/spr-headers.conf;
  }

  location /login/ {
    proxy_pass http://login:8000/;
    include /etc/nginx/spr-proxy.conf;
    include /etc/nginx/spr-headers.conf;
  }

  # Vite names every asset after its content, so a name never means two things.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/spr-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/spr-headers.conf;
    try_files $uri /index.html;
  }
}
