# The console's one origin: the built page, the policy API under /api/ and the demo login under /login/. Same origin
# means no CORS anywhere, and a content security policy that lets the page talk to nothing else.

# The question someone asked is in the page's address (/ask?q=...), so the access log holds the path and never the
# request line, the query string or the Referer. $asked_path is the address as it was sent, cut at the question mark
# ($uri would not do: for a page it has already become /index.html). tools/smoke.py sends a marked question and fails
# if any log of the stack contains it. upstream= is the status the API or the login answered with, which is what
# tells a 502 from this server apart from a 503 from the API.
map $request_uri $asked_path {
  ~^(?<path>[^?]*) $path;
}

log_format spr '$remote_addr [$time_iso8601] $request_method $asked_path $status $body_bytes_sent '
               'upstream=$upstream_status ${request_time}s';

# A built asset is named after its content and may be kept for a year. Anything else answered under /assets/, a 404
# above all, may not be kept at all: the name will mean something after the next build.
map $status $asset_cache {
  default "no-store";
  200     "public, max-age=31536000, immutable";
  206     "public, max-age=31536000, immutable";
  304     "public, max-age=31536000, immutable";
}

# A request addressed to any name but the two below is dropped without an answer. A page on another site whose name
# has been re-pointed at 127.0.0.1 (DNS rebinding) still sends that name in Host, and the demo login behind this
# server hands a token to whoever can reach it.
server {
  listen 8080 default_server;
  server_name _;
  access_log /var/log/nginx/access.log spr;
  return 444;
}

server {
  listen 8080;
  server_name 127.0.0.1 localhost;
  root /usr/share/nginx/html;
  server_tokens off;

  access_log /var/log/nginx/access.log spr;
  # nginx writes the request line and the Referer into every error-level line and offers no format for it, so only
  # what stops the server is logged here. A failing upstream shows in the access log as its status.
  error_log /var/log/nginx/error.log crit;
  log_not_found off;

  # nginx compresses at level 1 unless told otherwise, which sent the largest script as 43.5 kB where level 6 sends
  # it smaller for a few milliseconds of CPU per uncached request (docs/operations.md has the measured sizes).
  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;
  gzip_vary on;

  # nginx drops inherited add_header lines in any location that adds one of its own, so the security headers are a
  # file that every location includes. A journey requests something from each location and checks them.
  include /etc/nginx/spr-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/spr-headers.conf;
    return 200 "ok\n";
  }

  # Answers from the API and the login hold restricted text and tokens. The browser's HTTP cache outlives a sign-out,
  # so none of them may be written to it.
  location /api/ {
    proxy_pass http://api:8000/;
    include /etc/nginx/spr-proxy.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/spr-headers.conf;
  }

  location /login/ {
    proxy_pass http://login:8000/;
    include /etc/nginx/spr-proxy.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/spr-headers.conf;
  }

  location /assets/ {
    add_header Cache-Control $asset_cache always;
    include /etc/nginx/spr-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/spr-headers.conf;
    try_files $uri /index.html;
  }
}
